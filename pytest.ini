[pytest]
testpaths = tests
pythonpath = .
bdd_features_base_dir = tests/features
addopts = -ra --strict-markers --strict-config
markers =
    prod: catalogue module (stc-prod-*)
    cart: cart creation and reading (stc-cart-*)
    item: add, change and remove cart lines (stc-item-*)
    stock: stock rules (stc-stock-*)
    tot: totals and shipping (stc-tot-*)
    promo: promo codes (stc-promo-*)
    chk: checkout (stc-chk-*)
    ord: order status (stc-ord-*)
    conc: checkouts at the same time (stc-conc-*)
    amb: unclear points of the specification (stc-amb-*)
    proposed: expected result is a proposal, to confirm with the spec author
    smoke: fast checks that tell if the API is alive and sane
    positive: expected-success scenarios
    negative: expected-error scenarios